<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Eski başlatma sayfasının oynatıcı düzeni (7efcc3c): kaydırılabilir sayfa + alt çubuk -->
<style>
  html, body { margin: 0; }
  body { padding: 16px; min-height: 150vh; font: 16px sans-serif; }
  #oynatici { position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; flex-direction: column; }
  #ekran { flex: 1; width: 100%; height: 100%; border: 0; display: block; background: #000; }
  #cubuk { display: flex; justify-content: center; gap: 28px; padding: 8px 12px; background: #0a0a0a; }
  #cubuk button { min-height: 40px; padding: 6px 18px; background: transparent; color: #e6e6e6; border: 0; }
</style>
<p>başlatma sayfası</p>
<div id="oynatici"><iframe id="ekran" allow="autoplay; fullscreen; clipboard-write"></iframe>
  <div id="cubuk"><button>▢</button><button>◯</button><button>◁</button><button>⚙</button><button>✕</button></div></div>
